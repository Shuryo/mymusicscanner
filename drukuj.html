<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Druk kart</title>
  <link rel="icon" href="ikona.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root { --card: 65mm; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9e6f2; color: #14111f; }
    .bar { position: sticky; top: 0; background: #14111f; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 2; }
    .bar h1 { font-size: 1.05rem; margin: 0; flex: 1 1 200px; }
    .bar button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 9px 14px; background: #ff3d7f; color: #fff; cursor: pointer; }
    .bar label { font-size: .9rem; display: flex; gap: 6px; align-items: center; }
    .bar p { flex-basis: 100%; margin: 0; font-size: .82rem; color: #c9c2e6; }
    .page { width: 210mm; height: 297mm; margin: 16px auto; background: #fff; display: grid; place-content: center; box-shadow: 0 4px 20px #0002; break-after: page; page-break-after: always; }
    .grid { display: grid; grid-template-columns: repeat(3, var(--card)); grid-auto-rows: var(--card); }
    .c { width: var(--card); height: var(--card); border: .2mm dashed #bbb; position: relative; overflow: hidden; }
    .front { display: grid; place-items: center; }
    .front .qr { width: 44mm; height: 44mm; }
    .front .qr svg { width: 100%; height: 100%; display: block; }
    .front .lbl { position: absolute; bottom: 4mm; left: 0; right: 0; text-align: center; font-size: 7pt; color: #777; letter-spacing: .05em; }
    .back { display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; padding: 6mm 5mm; color: #fff; }
    .back .who { font-weight: 800; font-size: 10.5pt; line-height: 1.15; }
    .back .year { font-weight: 900; font-size: 34pt; line-height: 1; }
    .back .what { font-style: italic; font-size: 10pt; line-height: 1.15; }
    .empty { border-color: transparent; }
    .info { text-align: center; padding: 40px; }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; box-shadow: none; }
      .back { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1 id="tytul">Druk kart</h1>
    <label><input type="checkbox" id="cb-kolor" checked> kolorowe tła</label>
    <button type="button" onclick="print()">Drukuj</button>
    <p>Drukuj dwustronnie, odwracanie wzdłuż dłuższej krawędzi, skala 100% (bez „dopasuj do strony”). Strony nieparzyste to kody QR, parzyste – odpowiedzi. Karta 6,5 × 6,5 cm.</p>
  </div>
  <div id="strony"><p class="info">Ładowanie…</p></div>

  <script type="module">
    import * as data from './js/data.js';

    const PALETA = ['#ff3d7f', '#8a3dff', '#2b7fff', '#00a88f', '#ff8a00', '#e0245e', '#5b3df5', '#0096c7'];
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const talia = new URLSearchParams(location.search).get('talia') || '';
    document.getElementById('tytul').textContent = 'Druk kart – talia: ' + talia;

    function qrSvg(text) {
      const q = qrcode(0, 'M');
      q.addData(text);
      q.make();
      return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }

    function render() {
      const kolor = document.getElementById('cb-kolor').checked;
      const karty = data.customCards().filter((c) => c.talia === talia).sort((a, b) => a.numer - b.numer);
      const box = document.getElementById('strony');
      if (!karty.length) { box.innerHTML = '<p class="info">Brak kart w tej talii.</p>'; return; }
      let html = '';
      for (let i = 0; i < karty.length; i += 12) {
        const part = karty.slice(i, i + 12);
        while (part.length < 12) part.push(null);
        // Przód
        html += '<div class="page"><div class="grid">' + part.map((c) => c
          ? `<div class="c front"><div class="qr">${qrSvg(data.cardUrl(c.talia, c.numer))}</div><div class="lbl">${esc(c.talia)} · ${esc(c.numer)}</div></div>`
          : '<div class="c empty"></div>').join('') + '</div></div>';
        // Tył – kolumny w odbiciu lustrzanym, żeby po odwróceniu kartki trafić na właściwy przód
        const back = [];
        for (let r = 0; r < 4; r++) back.push(...part.slice(r * 3, r * 3 + 3).reverse());
        html += '<div class="page"><div class="grid">' + back.map((c, j) => {
          if (!c) return '<div class="c empty"></div>';
          const bg = kolor ? PALETA[(parseInt(c.numer, 10) || j) % PALETA.length] : '#fff';
          const fg = kolor ? '#fff' : '#14111f';
          return `<div class="c back" style="background:${bg};color:${fg}"><div class="who">${esc(c.wykonawca)}</div><div class="year">${esc(c.rok)}</div><div class="what">${esc(c.tytul)}</div></div>`;
        }).join('') + '</div></div>';
      }
      box.innerHTML = html;
    }

    document.getElementById('cb-kolor').addEventListener('change', render);
    render(); // z pamięci podręcznej
    data.loadSheet().then(render).catch(() => {});
  </script>
</body>
</html>
